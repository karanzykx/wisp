name: Release

# Push a tag like v1.0.0 and this builds the DMG from that exact commit and
# publishes it, with its SHA-256, as a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the engine version
        run: |
          set -euo pipefail
          version="$(/bin/bash engine/wisp.sh --version | awk '{print $2}')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match engine version v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Tests
        run: |
          /bin/bash engine/wisp.sh --self-test
          /bin/bash tests/e2e.sh

      - name: Build
        run: scripts/build.sh

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md >notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG entry for $VERSION" >&2; exit 1; fi
          {
            echo
            echo "---"
            echo "**Install:** download \`Wisp.dmg\` below, or \`brew install --cask karanzykx/tap/wisp\`."
            echo "SHA-256 is in \`Wisp.dmg.sha256\`."
          } >>notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Wisp.dmg dist/Wisp.dmg.sha256 \
            --title "Wisp $VERSION" \
            --notes-file notes.md \
            --verify-tag

      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Wisp.dmg
