name: Bug report
description: Something did not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **If Wisp offered or removed something it should not have** (documents, logins, passkeys,
        browser profiles), do not post it here: use the
        [private security advisory](https://github.com/karanzykx/wisp/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Wisp version
      description: Run `wisp --version`, or see Settings → About in the app.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 15.2, Apple M2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Homebrew
        - DMG download
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The newest file in `~/Library/Logs/Wisp/`. Remove anything personal first.
      render: text
